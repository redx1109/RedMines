<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Mines</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
</head>
<body>
    <div id="app">
        <button id="globalBackBtn" class="backBtn" style="display:none;">←</button>
        <div class="bgIcons">
            <span class="mine"></span><span class="flag"></span><span class="mine"></span>
            <span class="flag"></span><span class="mine"></span><span class="flag"></span>
            <span class="mine"></span><span class="flag"></span><span class="mine"></span>
            <span class="flag"></span><span class="mine"></span><span class="flag"></span>
        </div>
        <header>
            <h1>Red Mines</h1>
            <h2>Classic Minesweeper but better</h2>
        </header>
        <div id="modeSelect" style="display: none;">
            <div class="modeCard" id="classicCard">
                <h3>Classic</h3>
                <p>Small grids, fits your screen</p>
            </div>
            <div class="modeCard" id="bigWorldCard">
                <h3>Big World</h3>
                <p>Huge grids, scroll to explore</p>
            </div>
        </div>

        <div id="difficulty" style="display: none;">
            <div class="sizePicker" id="gridSizePicker" data-value="10">
                <button type="button" data-val="8">8×8</button>
                <button type="button" data-val="10" class="active">10×10</button>
                <button type="button" data-val="12">12×12</button>
                <button type="button" data-val="16">16×16</button>
            </div>
            <label>Mines: 
                <input type="number" id="mineCount" value="15" min="5" max="50">
            </label>
            <button id="classicStartBtn" class="styledBtn">Start</button>
        </div>
        
        <div id="bigDifficulty" style="display: none;">
            <div class="sizePicker" id="bigGridSizePicker" data-value="30">
                <button type="button" data-val="20">20×20</button>
                <button type="button" data-val="30" class="active">30×30</button>
                <button type="button" data-val="40">40×40</button>
                <button type="button" data-val="50">50×50</button>
            </div>
            <label>Mines: 
                <input type="number" id="bigMineCount" value="99" min="20" max="500">
            </label>
            <button id="bigStartBtn" class="styledBtn">Start</button>
        </div>

        <button id="playbtn">Play</button>
        <div id="gameArea">
            <div id="stats">
                <span id="streak">🔥 0</span>
                <span id="timer">⏱ 0:00</span>
                <span id="minesLeft">💣 15</span>
            </div>
            <div id="boardWrapper">
                <div id="board"></div>
            </div>
        </div>
        <div id="message">
            <p id="messageText"></p>
            <div class="msgBtns">
                <button id="restartBtn">Restart</button>
                <button id="menuBtn">Menu</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
